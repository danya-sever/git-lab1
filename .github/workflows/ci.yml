name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required files
        run: |
          test -f myfile.txt
          test -f ourfile.txt
          test -f yourfile.txt
          test -f .gitignore

      - name: Check pull request template
        run: |
          test -f .github/PULL_REQUEST_TEMPLATE.md
          grep -q "Описание изменений" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "Проверка" .github/PULL_REQUEST_TEMPLATE.md

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown,unverified
